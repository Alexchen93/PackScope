name: PackScope checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 python3-gi python3-requests python3-yaml python3-dateutil python3-colorama python3-pip python3-setuptools python3-wheel python3-pycodestyle libqt5svg5 dpkg-dev
      - name: Check syntax and basic formatting
        run: |
          python3 -m compileall -q packscope
          python3 -m pycodestyle --select=E9,W191,W291,W293 packscope
          git diff --check
      - name: Run PackScope tests and package checks
        run: python3 -m unittest discover -s tests -p 'test_packscope*.py'
      - name: Build DEB and inspect metadata
        run: |
          sh packaging/build-deb.sh
          deb="dist/packscope_$(python3 -c 'import packscope; print(packscope.__version__.replace(".dev", "~dev"))')_all.deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

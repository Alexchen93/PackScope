[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packscope"
description = "Ubuntu software manager for APT, Snap, Flatpak, AppImage and developer tools"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dynamic = ["version"]
readme = "README.md"
authors = [{name = "PackScope contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Software Distribution"
]
dependencies = [
    "pyqt5 >= 5.12",
    "requests >= 2.18",
    "colorama >= 0.3.8",
    "pyyaml >= 3.13",
    "python-dateutil >= 2.7"
]

[project.scripts]
packscope = "packscope.app:main"

[project.urls]
Repository = "https://github.com/Alexchen93/PackScope"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "packscope.__version__"}

[tool.setuptools.packages.find]
exclude = ["tests.*", "tests"]

[tool.setuptools.package-data]
packscope = ["assets/*.svg", "icons/*.svg"]
